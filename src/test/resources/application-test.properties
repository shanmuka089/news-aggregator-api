spring.application.name=news-aggregator
spring.application.base-path=${spring.application.name}/api/v1

# Client Configurations
client.g-news.api-version=api/v4
client.news-api.api-version=v2

# Client gs-client endpoints
client.gs-client.gs-client-base-url=${client.g-news.base-url}
client.gs-client.gs-client-search-path=/${client.g-news.api-version}/search
client.gs-client.gs-client-top-headlines-path=/${client.g-news.api-version}/top-headlines

# Client news-api endpoints
client.news-api-client.news-api-base-url=${client.news-api.base-url}
client.news-api-client.news-api-search-path=/${client.news-api.api-version}/everything
client.news-api-client.news-api-top-headlines-path=/${client.news-api.api-version}/top-headlines
client.news-api-client.news-api-sources-path=/${client.news-api.api-version}/sources

error.code.file.name=error-codes

# application.properties
spring.datasource.url=jdbc:h2:mem:news_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=


# enable H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# client configurations
client.g-news.base-url=https://gnews.io
client.g-news.api-key=f87e6d0fa711e7a57304f6cc564ed44f

client.news-api.base-url=https://newsapi.org
client.news-api.api-key=a485fa1f5a69408c9524d2dfb179b15a